<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Luis Ybarra Aspichueta</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Enlaces para importar la fuente desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #191e26;
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
    }

    .bar {
      height: 50px;
      background: #323b4c;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      font-weight: 500;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .bar a {
      color: #323b4c;
      background: white;
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      height: 33px;
    }

    .bar a:hover {
      background-color: #e2e8f0;
    }

    /* Estilo para los botones de icono */
    .bar a.icon-btn {
      padding: 0px;
      width: 33px;
    }

    .bar a.icon-btn svg {
      width: 30px;
      height: 30px;
    }

    .bar a.icon-btn.linkedin svg {
      fill: #0a66c2;
    }

    /* El icono de Gmail es más ancho que alto, 24px encaja clavado en la caja de 33px */
    .bar a.icon-btn.email svg {
      width: 25px;
      height: 25px;
    }

    .cv-container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 10px 20px 10px;
    }

    .cv-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="bar">
    <span>Curriculum Vitae</span>
    <div class="nav-buttons">
      <!-- Botón de LinkedIn -->
      <a href="https://www.linkedin.com/in/luisybarraaspichueta" class="icon-btn linkedin" target="_blank" rel="noopener noreferrer" aria-label="Perfil de LinkedIn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
        </svg>
      </a>

      <!-- Botón de Correo -->
      <a href="mailto:contact@ybarra.cc" class="icon-btn email" aria-label="Enviar correo a contact@ybarra.cc">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path fill="#323b4c" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </a>

      <!-- Botón Descargar PDF -->
      <a href="cv.pdf" download>Descargar PDF</a>
    </div>
  </div>

  <div class="cv-container">
    <img src="cv.svg" alt="CV Luis Ybarra Aspichueta">
  </div>

</body>
</html>
